<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>Ficha cadastro</h1>
    <form>
        <label class="form-label g-0" for="Nome">Nome: </label>
        <input class="form-control" type="text" id="nome">
        <label class="form-label" for="email">Email: </label>
        <input class="form-control" type="email" class="form-control" id="email">
        <label class="form-label" for="telefone" class="form-label">Telefone: </label>
        <input class="form-control" type="tel" class="form-control">
        <button class="btn btn-success">Enviar</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
